  <path d="M 284 450 C 259 390 269 331 303 274" fill="none" stroke="#174C3C" stroke-width="115" stroke-linecap="round"/>
  <path d="M 284 450 C 259 390 269 331 303 274" fill="none" stroke="#65C994" stroke-width="100" stroke-linecap="round"/>
  <path d="M 298 341 C 297 367 298 392 304 414" fill="none" stroke="#B9F0C9" stroke-width="29" stroke-linecap="round"/>
  <!-- Cabeça grande, ligeiramente inclinada. -->
  <path d="M 239 245 C 216 207 235 153 289 134 C 338 116 393 130 419 170 C 435 195 430 220 457 233 C 490 247 494 292 468 319 C 440 348 368 356 296 332 C 245 315 225 283 239 245 Z" fill="#174C3C"/>
  <path d="M 249 241 C 228 207 248 164 294 148 C 338 134 383 145 407 181 C 424 206 423 232 448 245 C 475 259 478 288 455 307 C 428 331 366 336 303 316 C 259 302 240 275 249 241 Z" fill="#81D9A3"/>
  <!-- Focinho e bochechas. -->
  <path d="M 316 273 C 349 253 406 262 450 249 C 478 262 474 290 453 307 C 424 330 363 325 318 304 Z" fill="#BFF0CB"/>
  <ellipse cx="295" cy="264" rx="18" ry="11" fill="#F6A9A6" opacity=".65"/>
  <ellipse cx="426" cy="290" rx="17" ry="10" fill="#F6A9A6" opacity=".55"/>

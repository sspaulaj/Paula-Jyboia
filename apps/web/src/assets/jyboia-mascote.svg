  <ellipse cx="298" cy="228" rx="22" ry="29" fill="#173F35"/>
  <ellipse cx="378" cy="226" rx="22" ry="29" fill="#173F35"/>
  <circle cx="290" cy="216" r="8" fill="#FFFFFF"/>
  <circle cx="370" cy="214" r="8" fill="#FFFFFF"/>
  <path d="M 276 188 Q 298 176 315 190 M 358 188 Q 378 178 396 192" fill="none" stroke="#174C3C" stroke-width="7" stroke-linecap="round"/>
  <circle cx="438" cy="274" r="5" fill="#245747"/>
  <path d="M 358 297 Q 382 315 407 299" fill="none" stroke="#245747" stroke-width="6" stroke-linecap="round"/>

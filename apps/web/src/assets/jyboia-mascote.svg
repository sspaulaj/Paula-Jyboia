<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Jiboia, mascote do Projeto Jyboia</title>
  <desc id="desc">Ilustração vetorial bidimensional de uma jiboia verde simpática, enrolada em espiral, com olhos expressivos e pequenos detalhes de circuitos.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE0AD"/>
      <stop offset="1" stop-color="#42AF81"/>
    </linearGradient>
  </defs>
  <!-- Cauda em espiral, com contorno forte para leitura visual em tamanhos pequenos. -->
  <path d="M 260 450 C 198 432 173 479 194 532 C 220 595 327 620 446 583 C 560 547 568 460 524 409 C 478 356 403 370 379 423 C 362 464 391 501 429 498 C 454 496 464 476 455 460" fill="none" stroke="#174C3C" stroke-width="119" stroke-linecap="round" stroke-linejoin="round"/>

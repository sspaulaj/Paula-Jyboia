  <g fill="none" stroke="#D8FFF0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 404 L 243 417 L 243 436"/>
    <path d="M 324 554 L 342 536 L 366 536"/>
    <path d="M 494 543 L 512 526"/>
